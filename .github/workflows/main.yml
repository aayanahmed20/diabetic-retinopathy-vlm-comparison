name: Validate pilot notebook

# There are no GPU/Kaggle/Gemini/HF credentials available in CI, so this workflow does
# NOT attempt the real-run pipeline. It regenerates and executes the pilot notebook
# (PILOT_MODE=1, synthetic data + seeded mock predictions only) and fails the build if it
# doesn't run cleanly end to end. It never commits anything back to the repo -- if you
# want updated results/ artifacts, run `python build_notebook.py` and the notebook
# execution locally and commit the output yourself.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-pilot-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pilot-mode dependencies
        # Pilot mode only needs pandas/numpy/scikit-learn/matplotlib/seaborn/tabulate +
        # nbformat/nbclient to build and execute the notebook -- none of the real-mode
        # deps (kaggle, google-genai, transformers, torch, gdown) are needed or installed
        # here, since PILOT_MODE never imports them.
        run: |
          python -m pip install --upgrade pip
          pip install nbformat nbclient nbconvert ipykernel pandas numpy scikit-learn matplotlib seaborn tabulate

      - name: Regenerate pilot notebook from build_notebook.py
        run: python build_notebook.py
        env:
          PILOT_MODE: "1"

      - name: Validate notebook is well-formed JSON
        run: python -c "import json; json.load(open('notebooks/DR_VLM_Comparison.ipynb'))"

      - name: Execute pilot notebook end to end
        # Runs via nbclient directly (not the `jupyter nbconvert --execute` CLI) so the
        # kernel's working directory is explicitly the repo root -- nbconvert's CLI
        # defaults execution cwd to the notebook's own directory (notebooks/), which
        # would make the notebook's "results/..." paths resolve to notebooks/results/
        # instead of the repo-root results/ this workflow (and the README) expect.
        run: |
          python - <<'PY'
          import nbformat
          from nbclient import NotebookClient

          nb_path = "notebooks/DR_VLM_Comparison.ipynb"
          nb = nbformat.read(nb_path, as_version=4)
          client = NotebookClient(nb, timeout=300, resources={"metadata": {"path": "."}})
          client.execute()
          nbformat.write(nb, nb_path)
          print("Pilot notebook executed successfully.")
          PY


      - name: Check pilot artifacts were produced
        run: |
          test -f results/predictions.csv
          test -f results/metrics.txt
          wc -l results/predictions.csv
          cat results/metrics.txt

      - name: Upload pilot results artifact
        uses: actions/upload-artifact@v4
        with:
          name: dr-vlm-pilot-results
          path: |
            results/
            notebooks/DR_VLM_Comparison.ipynb
